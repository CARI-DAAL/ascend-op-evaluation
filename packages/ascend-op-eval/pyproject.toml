[project]
name = "ascend-op-eval"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "redis==8.0.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "rfc8785==0.1.4",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
# Tensor/cache tests use the Torch-to-NumPy bridge; Torch does not install NumPy.
# Profiler CSV tests need pandas even on CPU-only CI hosts.
# Keep the test stack compatible across the Python 3.10–3.12 CI matrix.
test = ["pytest==9.1.1", "fakeredis==2.37.0", "httpx==0.28.1", "numpy==2.2.6", "pandas==2.2.3"]
    # Full Ascend NPU stack — the single version declaration shared by BOTH
    # deployment paths: `pip install -e ".[npu]"` (host / scripts/start.sh)
    # and the Docker build. torch_npu / triton-ascend are not on PyPI; install
    # with --extra-index-url pointing at the Ascend wheel index. setproctitle
    # adds full task titles in ps (short npu-smi names use prctl); pyyaml is an undeclared
    # torch_npu import (npu/_memory_viz.py); pandas is needed by the engine.
    npu = [
        "torch==2.9.0",
        "torch_npu==2.9.0.post8",
        # Ascend's distribution supplies the triton module. Installing a
        # separate upstream triton wheel would overwrite that implementation.
        "triton-ascend==3.2.0",
        "pandas",
        "pyyaml",
        "setproctitle==1.3.7",
    ]
dev = ["ruff==0.16.0"]

[project.scripts]
ascend-op-eval-server = "ascend_op_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ascend_op_eval.execution" = ["INPUT_GENERATION_LICENSE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
