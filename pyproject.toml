[tool.pytest.ini_options]
pythonpath = ["packages/ascend-op-eval/src", "packages/ascend-op-eval-client/src", "adapters/default/src", "packages/ascend-op-eval-compat/src"]
markers = [
    "npu: requires a real Ascend NPU and a deployed service (production release gate)",
    "release_gate: orchestrated by scripts/npu_release_gate.py, never run standalone in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Preserve vendored engine and fixed upstream example source bytes/headers.
extend-exclude = ["packages/ascend-op-eval/src/ascend_op_eval/engine", "adapters/cannbench/src/ascend_op_eval_adapter_cannbench/bundle/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve existing formatting during runtime relocation. Deployments must
# regenerate the source SHA pins for these moved helpers before enabling reuse.
"packages/ascend-op-eval/src/ascend_op_eval/runtimes/sandbox.py" = ["I001"]
"packages/ascend-op-eval/src/ascend_op_eval/execution/reference_timing_reuse.py" = ["E501", "B905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
